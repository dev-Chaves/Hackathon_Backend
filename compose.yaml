services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    command: >-
      sh -c "alembic upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"
    environment:
      APP_NAME: Continuidade Operacional API
      APP_ENV: development
      APP_DEBUG: "false"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL deve estar definida no arquivo .env}
    ports:
      - "8000:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://localhost:8000/health', timeout=2)
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    restart: unless-stopped
